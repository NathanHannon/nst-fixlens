services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fixlens
      POSTGRES_PASSWORD: fixlens
      POSTGRES_DB: fixlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixlens -d fixlens"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
